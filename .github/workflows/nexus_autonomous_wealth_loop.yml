name: NEXUS Wealth Loop Readiness (read-only)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/wealth_loop_readiness.py'
      - 'test_wealth_readiness.py'
      - '.github/workflows/nexus_autonomous_wealth_loop.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/wealth_loop_readiness.py'
      - 'test_wealth_readiness.py'
      - '.github/workflows/nexus_autonomous_wealth_loop.yml'

permissions:
  contents: read

jobs:
  evidence_only:
    name: Read-only readiness assessment (not execution)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test evidence boundary
        run: python -m unittest -v test_wealth_readiness
      - name: Inspect only files, never execute worker or connect providers
        run: python scripts/wealth_loop_readiness.py --repo-root . --output wealth-readiness.json
      - name: Publish BLOCKED status explicitly, even when this audit job passes
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('wealth-readiness.json').read_text())
          assert result["status"] == "BLOCKED", "unexpected readiness state"
          assert result["production_readiness"] is False
          assert result["agents_executed"] == 0
          lines = [
              "## MARS wealth-loop source readiness",
              "**BLOCKED: no approval or execution is established by this workflow.**",
              f"Worker source present: {result['worker_source_present']}",
              "Stripe settlement: NOT VERIFIED",
              "Signed RHNS approval: NOT VERIFIED",
              "Outbound dispatch: NOT VERIFIED",
              "No payments, dispatches, emails, or customer actions attempted."
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mars-wealth-readiness
          path: wealth-readiness.json
          retention-days: 7
