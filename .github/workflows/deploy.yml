name: MARS API Validation (deployment gated)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify both ASGI entrypoints enforce operator policy
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Import protected entrypoints
        run: |
          python - <<'PY'
          from main import app as primary
          from guarded_main import app as legacy
          from rhns_middleware import OperatorGuard
          assert primary is legacy
          assert isinstance(primary, OperatorGuard)
          print("Both ASGI entrypoints are guarded; no deployment attempted.")
          PY
      - name: Record non-deployment boundary
        run: |
          echo "Code checks only. Production deployment remains separately authorized." >> "$GITHUB_STEP_SUMMARY"
          echo "No Railway deploy, Resend notification, Stripe request, or live task dispatch." >> "$GITHUB_STEP_SUMMARY"
